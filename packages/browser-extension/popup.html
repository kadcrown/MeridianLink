<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeridianLink Creator</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
    }
    h2 { font-size: 14px; margin-top: 0; margin-bottom: 12px; color: #14b8a6; }
    input, button, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #020817;
      color: #fff;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      background: #0d9488;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #0f766e; }
    .result {
      background: #1e293b;
      padding: 8px;
      border-radius: 8px;
      word-break: break-all;
      margin-top: 8px;
      font-family: monospace;
      font-size: 11px;
    }
    .muted { color: #94a3b8; font-size: 11px; }
  </style>
</head>
<body>
  <h2>MeridianLink Creator</h2>
  <label class="muted">Active Tab URL:</label>
  <input type="text" id="targetUrl" placeholder="https://..." readonly />

  <label class="muted">Display Name:</label>
  <input type="text" id="displayName" placeholder="Product Title" />

  <button id="createBtn">Generate SmartLink</button>

  <div id="output" style="display:none;" class="result">
    <span class="muted">Generated Short URL:</span><br/>
    <a id="shortLink" href="#" target="_blank" style="color:#2dd4bf;"></a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
