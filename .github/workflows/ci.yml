name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: 'file:./dev.db'
          APP_SECRET: 'ci_test_secret_key_random_value_32_characters'
          OWNER_EMAIL: 'owner@meridianlink.local'
          OWNER_INITIAL_PASSWORD: 'ChangeMeInProd123!'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
